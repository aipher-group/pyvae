# Isolated environment for the Kang analysis.
#
#   cd experiments/kang && pixi install
#   pixi run all              # the whole grid, 3 GPUs
#   pixi run plan             # dry run, touches nothing
#
# pyvae is installed EDITABLE here, so the environment tracks the working tree.
# That is a deliberate reversal: this file used to pin a built wheel, on the
# argument that a run should be reproducible from the lock file alone. It cannot
# be, while the experiment and the library change together. The architecture this
# experiment selects -- the covariate routed through the pathway layer, the
# encoder's covariate route closed, the decoder's unit->gene weights positive --
# lives in `pyvae`, and both experiments must run the same code for their results
# to be comparable. Pinning a wheel forced the same surgery to be duplicated in
# each experiment, which is exactly the drift the pin was meant to prevent.
#
# BEFORE PUBLICATION, pin it. Swap the `path` line in [pypi-dependencies] for the
# `git` + `rev` form documented there, with the 40-character commit sha. That is
# the only edit needed, and it restores reproducibility from the lock file with no
# checkout at all.
#
# CUDA: pytorch 2.5.1/cuda120 matches the root project's cuda12 environment. That
# is the newest conda-forge build that works on drivers capped at CUDA 12.4; 2.6+
# requires cuda-version >=12.6. Check nvidia-smi's "CUDA Version" before bumping.

[workspace]
name = "kang-experiment"
version = "0.1.0"
# bioconda carries snakemake; conda-forge does not.
channels = ["conda-forge", "bioconda", "pytorch", "nvidia"]
# Named explicitly rather than via the deprecated [system-requirements] table.
# pixi >=0.79 rewrites that table into a generated platform key on every
# invocation, which is why the root project's pixi.lock shows up modified after
# any pixi command and has to be checked out again before each sync. Naming the
# platform here keeps the lock stable.
platforms = [{ name = "linux-64-cuda-12", platform = "linux-64", cuda = "12" }]

[dependencies]
python = "3.13.*"
pip = "*"
pytorch = { version = "==2.5.1", build = "cuda120*" }
numpy = ">=1.26,<3"
pandas = ">=2.0,<3"
scipy = ">=1.10,<2"
scikit-learn = ">=1.7.2,<2"
scanpy = ">=1.11,<2"
anndata = ">=0.11.4,<0.12"
leidenalg = ">=0.10,<1"
python-igraph = ">=0.11.9,<2"
pynndescent = ">=0.5.13,<0.6"
tqdm = ">=4.66,<5"
pyyaml = "*"
snakemake-minimal = ">=8.20,<10"
# The showcase notebook runs as a workflow step. papermill executes it and keeps
# the executed copy; ipykernel is the kernel it executes in. matplotlib, seaborn
# and umap-learn arrive transitively through scanpy.
papermill = ">=2.6,<3"
ipykernel = "*"
# regenerate.sh runs the suite as a gate before committing hours to the grid.
# Deliberately here rather than in the root development environment: this is the
# environment the grid actually runs in, so it is the one worth testing.
pytest = ">=8,<10"

[pypi-dependencies]
# pyvae from the working tree, editable: see the header. An edit to pyvae/ takes
# effect in this environment immediately, with no reinstall, which is required
# while the library and the experiments are being changed together.
#
# To pin for publication, replace the line below with:
#
#   pyvae = { git = "https://github.com/aipher-group/pyvae.git", rev = "<40-char sha>" }
#
pyvae = { path = "../..", editable = true }

[tasks]
# Every path in the Snakefile and config.yaml is relative to this directory, so
# these run from here and `snakemake` finds the Snakefile by name.
all = "snakemake -j 42 --resources gpu=2"
plan = "snakemake -n -q"
setup = "bash 00_setup.sh"
verify = "python verify_findings.py"
status = "snakemake --summary"
report = "snakemake --report outputs/report.html"
unlock = "snakemake --unlock"
