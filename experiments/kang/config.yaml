# The Kang experiment, declaratively.
#
# The Snakefile turns every entry below into one job. Snakemake reruns a job
# only when its output is missing, so a killed run resumes where it stopped and
# a finished one is a no-op.
#
# Measured on 3x A100 80GB, 64 cores.

epochs: 250          # patience is pinned to epochs so cosine annealing completes
threads_per_job: 21  # see the Snakefile header on thread oversubscription
n_gpus: 3
seed: 42

data_folder: data
gmt: resources/c2.cp.reactome.v7.5.1.symbols.gmt

# The answer, fixed before anything runs. Kang et al. (2018) is PBMCs under
# interferon-beta against control, so this is the unit a model that uses its
# annotation should name. `verify_findings.py` treats it as a hard gate.
target: REACTOME_INTERFERON_ALPHA_BETA_SIGNALING
target_parent: REACTOME_INTERFERON_SIGNALING

# `01_architecture.py` crosses {real, permuted annotation} with four covariate
# schemes, so one job is eight fits of ~4 min each. One seed is enough here:
# the separation this dataset is asked for is rank 1 against rank ~1,300, not a
# variance.
#
# The previous grid -- 02_architecture_ablation.py, 03_sample_size_experiment.py,
# 04_encoder_fidelity_experiment.py, 28 training runs over eight configurations,
# two epoch budgets and two panel widths -- is gone. Its one surviving claim
# (zero inverted encoder units) is now an assert inside 01, because
# `nonneg_encoder` makes inversion unrepresentable rather than merely unlikely.
# Its retired claims are retired for cause: `pathway_unit_fidelity` medians
# measured distance from initialisation (an untrained non-negative model scores
# 0.75 and the score FALLS with training), and the sample-size experiment's
# model-against-naive win is reproduced by a permuted annotation. Neither bore
# on the architecture. What that grid never had is 01's one real control: an arm
# where the annotation itself is shuffled.
